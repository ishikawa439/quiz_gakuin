<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>丸バツクイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8F1FF; --panel:#FFFFFF; --ink:#14213D; --sub:#5B6B8C; --line:#C9D8F2;
  --maru:#E63946; --batsu:#2B59C3; --sun:#FFC93C; --ok:#1F9D63;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A33; --panel:#1A294D; --ink:#F2F6FF; --sub:#A9B8D9; --line:#2F4273;
    --maru:#FF6B76; --batsu:#6F97FF; --sun:#FFC93C; --ok:#46D69A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A33; --panel:#1A294D; --ink:#F2F6FF; --sub:#A9B8D9; --line:#2F4273;
  --maru:#FF6B76; --batsu:#6F97FF; --sun:#FFC93C; --ok:#46D69A;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  font-weight:500; line-height:1.6; font-size:17px;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:20px 20px 40px;position:relative}
.screen{display:none}
.screen.active{display:block}

/* 隠し管理者ボタン (左上・非表示) */
#adminHidden{
  position:fixed; top:env(safe-area-inset-top,0px); left:0;
  width:64px; height:64px; z-index:50;
  background:transparent; border:0; padding:0; opacity:0;
}
#adminHidden:focus-visible{opacity:1;background:var(--sun);border-radius:0 0 16px 0}

/* ホーム */
.home{text-align:center;padding-top:28px}
.marks{display:flex;justify-content:center;gap:18px;font-weight:900;font-size:64px;line-height:1}
.marks .m{color:var(--maru)} .marks .b{color:var(--batsu)}
h1{font-size:44px;font-weight:900;margin:8px 0 22px;letter-spacing:.04em}
.hero{
  width:min(100%,420px);aspect-ratio:4/3;margin:0 auto 28px;border-radius:28px;overflow:hidden;
  background:var(--panel);border:3px solid var(--ink);
  box-shadow:8px 8px 0 var(--sun);display:flex;align-items:center;justify-content:center;
}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ph{color:var(--sub);font-size:15px;padding:20px}
.btn{
  display:inline-block;border:3px solid var(--ink);background:var(--sun);color:#14213D;
  border-radius:999px;padding:14px 36px;font-weight:900;font-size:22px;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.big{padding:18px 56px;font-size:28px}
.btn.ghost{background:var(--panel);color:var(--ink);font-size:17px;padding:10px 22px;box-shadow:0 3px 0 var(--ink)}
.btn.danger{background:var(--maru);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}

/* 共通 */
.card{background:var(--panel);border:3px solid var(--ink);border-radius:24px;padding:22px}
h2{font-size:24px;font-weight:900;margin:0 0 14px}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=number],textarea{
  width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;
  border:2px solid var(--line);background:var(--bg);color:var(--ink);
}
textarea{min-height:84px;resize:vertical}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.hint{color:var(--sub);font-size:14px}

/* ニックネーム */
.nick{padding-top:48px}
.nick .card{text-align:center}
.nick input{text-align:center;font-size:24px;font-weight:700;margin:12px 0 22px}
.err{color:var(--maru);font-weight:700;min-height:1.6em;margin:-12px 0 10px}

/* クイズ */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}
.bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--sun);width:0;transition:width .3s}
.qtext{font-size:24px;font-weight:900;line-height:1.5;margin:6px 0 24px;min-height:120px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{
  aspect-ratio:1;border-radius:28px;border:4px solid var(--ink);background:var(--panel);
  font-size:96px;font-weight:900;line-height:1;box-shadow:0 6px 0 var(--ink);
  transition:transform .08s, box-shadow .08s;
}
.choice.m{color:var(--maru)} .choice.b{color:var(--batsu)}
.choice:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.choice[disabled]{pointer-events:none}
.choice.dim{opacity:.35}
.fb{margin-top:22px;text-align:center}
.verdict{font-size:56px;font-weight:900;line-height:1.2}
.verdict.ok{color:var(--maru)} .verdict.ng{color:var(--batsu)}
.verdict small{display:block;font-size:20px;color:var(--ink)}
.expl{margin:8px 0 18px;color:var(--sub)}
@media (prefers-reduced-motion: no-preference){
  .pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
}

/* 結果 */
.score{font-size:80px;font-weight:900;line-height:1.1}
.score span{font-size:32px}
.rank{list-style:none;margin:10px 0 0;padding:0;text-align:left}
.rank li{display:flex;justify-content:space-between;gap:10px;padding:8px 4px;border-bottom:2px dashed var(--line)}
.rank li.me{background:var(--sun);color:#14213D;border-radius:10px;padding:8px 10px;border-bottom:0}
.rank .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 管理者 */
.admin h2{margin-top:6px}
.admin .card{margin-bottom:18px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.ph-item{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:3px solid var(--line);padding:0;background:var(--bg)}
.ph-item img{width:100%;height:100%;object-fit:cover;display:block}
.ph-item.sel{border-color:var(--maru)}
.ph-item .tag{position:absolute;left:0;right:0;bottom:0;background:var(--maru);color:#fff;font-size:12px;font-weight:700;text-align:center}
.ph-item .x{
  position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;
  background:rgba(20,33,61,.8);color:#fff;border:0;font-size:16px;line-height:1;padding:0;
}
.seg{display:flex;gap:10px}
.seg button{
  flex:1;font-size:40px;font-weight:900;line-height:1;padding:8px;border-radius:16px;
  border:3px solid var(--line);background:var(--bg);
}
.seg button.m.on{border-color:var(--maru);background:var(--maru);color:#fff}
.seg button.b.on{border-color:var(--batsu);background:var(--batsu);color:#fff}
.qlist{list-style:none;margin:0;padding:0}
.qlist li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:2px dashed var(--line)}
.qlist .a{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#fff}
.qlist .a.m{background:var(--maru)} .qlist .a.b{background:var(--batsu)}
.qlist .t{flex:1;word-break:break-word}
.qlist .del{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:4px 10px;font-size:14px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,26,51,.6);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .box{background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:24px;padding:22px;max-width:380px;width:100%;text-align:center}
.modal .msg{font-weight:700;font-size:18px;margin:0 0 18px;word-break:break-word}
.modal .row{justify-content:center}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-weight:700;
  z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;
}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">

  <button id="adminHidden" aria-label="管理者ページ"></button>

  <!-- ホーム -->
  <section id="home" class="screen active">
    <div class="home">
      <div class="marks" aria-hidden="true"><span class="m">〇</span><span class="b">×</span></div>
      <h1>丸バツクイズ</h1>
      <div class="hero" id="hero"></div>
      <button class="btn big" id="startBtn">クイズスタート</button>
    </div>
  </section>

  <!-- ニックネーム -->
  <section id="nick" class="screen">
    <div class="nick">
      <div class="card">
        <h2>ニックネームを入力</h2>
        <p class="hint" style="margin:0">結果のランキングに表示されます</p>
        <input type="text" id="nickInput" maxlength="12" placeholder="例:たろう" autocomplete="off">
        <div class="err" id="nickErr"></div>
        <button class="btn" id="nickGo">はじめる</button>
        <div style="margin-top:18px"><button class="btn ghost" id="nickBack">もどる</button></div>
      </div>
    </div>
  </section>

  <!-- クイズ -->
  <section id="quiz" class="screen">
    <div class="qhead"><span id="qnum"></span><span id="qname"></span></div>
    <div class="bar"><i id="qbar"></i></div>
    <div class="card">
      <div class="qtext" id="qtext"></div>
      <div class="choices">
        <button class="choice m" id="chM" aria-label="マル">〇</button>
        <button class="choice b" id="chB" aria-label="バツ">×</button>
      </div>
    </div>
    <div class="fb" id="fb" hidden>
      <div class="verdict" id="verdict"></div>
      <div class="expl" id="expl"></div>
      <button class="btn" id="nextBtn">つぎへ</button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="screen">
    <div class="card center" style="margin-top:24px">
      <div class="hint" id="rName"></div>
      <div class="score pop"><span id="rScore">0</span><span> / </span><span id="rTotal">0</span></div>
      <p id="rMsg" style="font-weight:900;font-size:22px;margin:6px 0 18px"></p>
      <div class="row" style="justify-content:center">
        <button class="btn" id="retryBtn">もう一度</button>
        <button class="btn ghost" id="homeBtn">トップへ</button>
      </div>
    </div>
    <div class="card" style="margin-top:18px">
      <h2>ランキング</h2>
      <ol class="rank" id="rank"></ol>
    </div>
  </section>

  <!-- 管理者 -->
  <section id="admin" class="screen admin">
    <div class="row spread" style="margin-bottom:6px">
      <h2 style="margin:0">管理者ページ</h2>
      <button class="btn ghost" id="adminBack">トップへ</button>
    </div>

    <div class="card">
      <h2>メイン画面の写真</h2>
      <p class="hint" style="margin:0 0 10px">写真を追加して、タップで表示する写真を選びます。</p>
      <input type="file" id="photoFile" accept="image/*" multiple hidden>
      <button class="btn ghost" id="photoAdd">写真を追加</button>
      <div class="photos" id="photos"></div>
      <div style="margin-top:12px"><button class="btn ghost" id="photoNone">写真を表示しない</button></div>
    </div>

    <div class="card">
      <h2>クイズを追加</h2>
      <label class="f" for="aq">問題文</label>
      <textarea id="aq" placeholder="例:富士山は日本一高い山である。"></textarea>
      <label class="f">答え</label>
      <div class="seg">
        <button class="m on" id="ansM" aria-label="答えはマル">〇</button>
        <button class="b" id="ansB" aria-label="答えはバツ">×</button>
      </div>
      <label class="f" for="ae">解説(なくてもOK)</label>
      <textarea id="ae" placeholder="例:標高3,776mで日本最高峰です。"></textarea>
      <div style="margin-top:16px"><button class="btn" id="addQ">クイズを追加</button></div>
    </div>

    <div class="card">
      <h2>出題数</h2>
      <p class="hint" style="margin:0 0 10px">クイズ一覧からランダムに選んで出題します。</p>
      <div class="row">
        <input type="number" id="countInput" min="1" inputmode="numeric" style="width:110px;font-size:22px;text-align:center">
        <span>問(全 <span id="countAll">0</span> 問中)</span>
      </div>
      <p class="hint" id="countNote" style="margin:8px 0 0"></p>
    </div>

    <div class="card">
      <h2>クイズ一覧(<span id="qcount">0</span>問)</h2>
      <ul class="qlist" id="qlist"></ul>
    </div>

    <div class="card">
      <div class="row spread" style="margin-bottom:6px">
        <h2 style="margin:0">ランキング管理</h2>
        <button class="btn ghost" id="rankClear">全員を削除</button>
      </div>
      <p class="hint" style="margin:0 0 6px">ニックネームを探して、削除したい記録を消せます。</p>
      <input type="text" id="rankSearch" placeholder="ニックネームで絞り込み" autocomplete="off">
      <ul class="qlist" id="rankAdmin"></ul>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <p class="msg" id="modalMsg"></p>
    <div class="row">
      <button class="btn ghost" id="modalNo">やめる</button>
      <button class="btn danger" id="modalYes">削除する</button>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var KEY = 'marubatsu_v1';
  var memory = null;

  function defaults(){
    return {
      photos: [], selected: null,
      quizzes: [
        {id:'d1', q:'富士山は日本で一番高い山である。', a:true, e:'標高3,776mで日本最高峰です。'},
        {id:'d2', q:'タコの心臓は3つある。', a:true, e:'えら心臓が2つ、全身に血を送る心臓が1つです。'},
        {id:'d3', q:'トマトは野菜ではなく、植物学上は果物に分類される。', a:false, e:'植物学では「果実」ですが、分類は立場で変わります。'}
      ],
      ranking: []
    };
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ var d = JSON.parse(raw); if(d && d.quizzes) return d; }
    }catch(e){}
    return memory || defaults();
  }
  var data = load();
  function save(){
    memory = data;
    try{ localStorage.setItem(KEY, JSON.stringify(data)); return true; }
    catch(e){ return false; }
  }

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function(){t.classList.remove('show')}, 2200);
  }
  function show(id){
    ['home','nick','quiz','result','admin'].forEach(function(s){
      $(s).classList.toggle('active', s===id);
    });
    window.scrollTo(0,0);
  }
  function ask(msg, cb){
    $('modalMsg').textContent = msg;
    $('modal').classList.add('show');
    function close(){ $('modal').classList.remove('show'); $('modalYes').onclick = null; $('modalNo').onclick = null; }
    $('modalYes').onclick = function(){ close(); cb(); };
    $('modalNo').onclick = close;
    $('modalNo').focus();
  }
  function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

  /* ---------- ホーム ---------- */
  function renderHero(){
    var h = $('hero'); h.innerHTML = '';
    var p = data.photos.filter(function(x){return x.id===data.selected})[0];
    if(p){ var img = new Image(); img.src = p.src; img.alt = ''; h.appendChild(img); }
    else { h.appendChild(el('div','ph','管理者ページで写真を選ぶと、ここに表示されます')); }
  }
  $('startBtn').onclick = function(){
    if(!data.quizzes.length){ toast('クイズがまだありません'); return; }
    $('nickErr').textContent = ''; show('nick'); $('nickInput').focus();
  };

  /* ---------- ニックネーム ---------- */
  var nickname = '';
  $('nickBack').onclick = function(){ show('home'); };
  $('nickInput').addEventListener('keydown', function(e){ if(e.key==='Enter') $('nickGo').click(); });
  $('nickGo').onclick = function(){
    var v = $('nickInput').value.trim();
    if(!v){ $('nickErr').textContent = 'ニックネームを入力してください'; return; }
    nickname = v; startQuiz();
  };

  /* ---------- クイズ ---------- */
  var list = [], idx = 0, score = 0, answered = false;
  function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }
  function questionCount(){
    var n = parseInt(data.count, 10);
    var all = data.quizzes.length;
    if(!n || n < 1 || n > all) return all;
    return n;
  }
  function renderCount(){
    var all = data.quizzes.length;
    $('countAll').textContent = all;
    $('countInput').max = all;
    $('countInput').value = questionCount();
    $('countNote').textContent = all ? '' : 'クイズを追加すると設定できます';
  }
  $('countInput').addEventListener('change', function(){
    var all = data.quizzes.length;
    var n = parseInt($('countInput').value, 10);
    if(!n || n < 1) n = 1;
    if(n > all){ n = all; toast('クイズは全部で' + all + '問です'); }
    data.count = n; save(); renderCount();
    toast('出題数を' + n + '問にしました');
  });
  function startQuiz(){
    list = shuffle(data.quizzes).slice(0, questionCount()); idx = 0; score = 0;
    $('qname').textContent = nickname + ' さん';
    show('quiz'); showQ();
  }
  function showQ(){
    answered = false;
    var q = list[idx];
    $('qnum').textContent = '第' + (idx+1) + '問 / ' + list.length + '問';
    $('qbar').style.width = (idx/list.length*100) + '%';
    $('qtext').textContent = q.q;
    $('fb').hidden = true;
    ['chM','chB'].forEach(function(id){ var b=$(id); b.disabled=false; b.classList.remove('dim'); });
  }
  function answer(val){
    if(answered) return; answered = true;
    var q = list[idx], ok = (val === q.a);
    if(ok) score++;
    $('chM').disabled = true; $('chB').disabled = true;
    $(val ? 'chB' : 'chM').classList.add('dim');
    var v = $('verdict');
    v.className = 'verdict pop ' + (ok ? 'ok' : 'ng');
    v.textContent = ok ? '〇 正解!' : '× ざんねん';
    var small = el('small', null, '正解は ' + (q.a ? '〇' : '×') + ' です');
    v.appendChild(small);
    $('expl').textContent = q.e || '';
    $('nextBtn').textContent = (idx === list.length-1) ? '結果を見る' : 'つぎへ';
    $('fb').hidden = false;
    $('qbar').style.width = ((idx+1)/list.length*100) + '%';
    $('fb').scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  $('chM').onclick = function(){ answer(true); };
  $('chB').onclick = function(){ answer(false); };
  $('nextBtn').onclick = function(){
    if(idx < list.length-1){ idx++; showQ(); } else { finish(); }
  };

  /* ---------- 結果 ---------- */
  function finish(){
    var entry = {id:uid(), name:nickname, score:score, total:list.length, at:Date.now()};
    data.ranking.push(entry);
    data.ranking.sort(function(a,b){
      var ra = a.score/a.total, rb = b.score/b.total;
      return (rb-ra) || (b.score-a.score) || (a.at-b.at);
    });
    data.ranking = data.ranking.slice(0, 50);
    save();
    $('rName').textContent = nickname + ' さんの結果';
    $('rScore').textContent = score; $('rTotal').textContent = list.length;
    var r = score/list.length;
    $('rMsg').textContent = r===1 ? '全問正解!すごい!' : r>=.7 ? 'よくできました!' : r>=.4 ? 'あと少し!' : 'もう一度チャレンジ!';
    var ol = $('rank'); ol.innerHTML = '';
    data.ranking.slice(0,5).forEach(function(x,i){
      var li = el('li', x.id===entry.id ? 'me' : '');
      li.appendChild(el('span','n',(i+1)+'位  '+x.name));
      li.appendChild(el('span',null,x.score+' / '+x.total));
      ol.appendChild(li);
    });
    show('result');
  }
  $('retryBtn').onclick = startQuiz;
  $('homeBtn').onclick = function(){ show('home'); };

  /* ---------- 管理者 ---------- */
  $('adminHidden').onclick = function(){ renderAdmin(); show('admin'); };
  $('adminBack').onclick = function(){ renderHero(); show('home'); };

  function resize(file, cb){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 900, w = img.width, h = img.height, s = Math.min(1, max/Math.max(w,h));
        var c = document.createElement('canvas'); c.width = Math.round(w*s); c.height = Math.round(h*s);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img,0,0,c.width,c.height);
        cb(c.toDataURL('image/jpeg', .85));
      };
      img.onerror = function(){ cb(null); };
      img.src = fr.result;
    };
    fr.onerror = function(){ cb(null); };
    fr.readAsDataURL(file);
  }
  $('photoAdd').onclick = function(){ $('photoFile').click(); };
  $('photoFile').onchange = function(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    var pending = files.length, added = 0;
    files.forEach(function(f){
      resize(f, function(src){
        if(src){ data.photos.push({id:uid(), src:src}); added++; }
        if(--pending === 0){
          if(added && !data.selected) data.selected = data.photos[data.photos.length-1].id;
          if(!save()) toast('保存容量がいっぱいです。写真を減らしてください');
          else if(added) toast(added + '枚追加しました');
          else toast('写真を読み込めませんでした');
          renderAdmin();
        }
      });
    });
  };
  $('photoNone').onclick = function(){ data.selected = null; save(); renderAdmin(); toast('写真を非表示にしました'); };

  var ans = true;
  $('ansM').onclick = function(){ ans = true; setAns(); };
  $('ansB').onclick = function(){ ans = false; setAns(); };
  function setAns(){ $('ansM').classList.toggle('on', ans); $('ansB').classList.toggle('on', !ans); }

  $('addQ').onclick = function(){
    var q = $('aq').value.trim();
    if(!q){ toast('問題文を入力してください'); $('aq').focus(); return; }
    data.quizzes.push({id:uid(), q:q, a:ans, e:$('ae').value.trim()});
    if(!save()) toast('保存できませんでした(このセッションのみ有効)');
    else toast('クイズを追加しました');
    $('aq').value = ''; $('ae').value = '';
    renderAdmin();
  };

  function renderRankAdmin(){
    var ul = $('rankAdmin'); ul.innerHTML = '';
    var kw = $('rankSearch').value.trim().toLowerCase();
    var rows = data.ranking.filter(function(x){ return !kw || x.name.toLowerCase().indexOf(kw) !== -1; });
    if(!rows.length){
      ul.appendChild(el('li','hint', data.ranking.length ? '該当する記録がありません' : 'ランキングの記録はまだありません'));
      return;
    }
    rows.forEach(function(x){
      var rankNo = data.ranking.indexOf(x) + 1;
      var li = el('li');
      li.appendChild(el('div','a m', rankNo));
      var t = el('div','t', x.name + '(' + x.score + ' / ' + x.total + ')');
      li.appendChild(t);
      var d = el('button','del','削除');
      d.setAttribute('aria-label', x.name + 'の記録を削除');
      d.onclick = function(){
        ask('「' + x.name + '」さんの記録(' + x.score + ' / ' + x.total + ')を削除しますか?', function(){
          data.ranking = data.ranking.filter(function(z){ return z.id !== x.id; });
          save(); renderRankAdmin(); toast('記録を削除しました');
        });
      };
      li.appendChild(d);
      ul.appendChild(li);
    });
  }
  $('rankSearch').addEventListener('input', renderRankAdmin);
  $('rankClear').onclick = function(){
    if(!data.ranking.length){ toast('削除する記録がありません'); return; }
    ask('ランキングの記録をすべて削除しますか?元に戻せません。', function(){
      data.ranking = []; save(); renderRankAdmin(); toast('すべて削除しました');
    });
  };

  function renderAdmin(){
    renderRankAdmin();
    renderCount();
    var box = $('photos'); box.innerHTML = '';
    if(!data.photos.length) box.appendChild(el('p','hint','写真はまだありません'));
    data.photos.forEach(function(p){
      var b = el('button','ph-item' + (p.id===data.selected ? ' sel' : ''));
      b.setAttribute('aria-label','この写真を表示する');
      var img = new Image(); img.src = p.src; img.alt = ''; b.appendChild(img);
      if(p.id===data.selected) b.appendChild(el('span','tag','表示中'));
      var x = el('button','x','×'); x.setAttribute('aria-label','写真を削除');
      x.onclick = function(ev){
        ev.stopPropagation();
        ask('この写真を削除しますか?', function(){
          data.photos = data.photos.filter(function(q){return q.id!==p.id});
          if(data.selected===p.id) data.selected = null;
          save(); renderAdmin();
        });
      };
      b.appendChild(x);
      b.onclick = function(){ data.selected = p.id; save(); renderAdmin(); toast('メイン画面の写真に設定しました'); };
      box.appendChild(b);
    });

    $('qcount').textContent = data.quizzes.length;
    var ul = $('qlist'); ul.innerHTML = '';
    if(!data.quizzes.length) ul.appendChild(el('li','hint','クイズがありません。上のフォームから追加してください'));
    data.quizzes.forEach(function(q){
      var li = el('li');
      li.appendChild(el('div','a ' + (q.a?'m':'b'), q.a ? '〇' : '×'));
      li.appendChild(el('div','t',q.q));
      var d = el('button','del','削除');
      d.onclick = function(){
        ask('このクイズを削除しますか?', function(){
          data.quizzes = data.quizzes.filter(function(z){return z.id!==q.id});
          save(); renderAdmin();
        });
      };
      li.appendChild(d);
      ul.appendChild(li);
    });
  }

  renderHero();
})();
</script>
</body>
</html>
